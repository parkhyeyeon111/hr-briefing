const pad = n => String(n).padStart(2, '0');
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const fmtAbs = d => `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
function fmtRel(d) {
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return `${m}분 전`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}시간 전`;
  const dd = Math.floor(h / 24);
  return dd < 30 ? `${dd}일 전` : `${Math.floor(dd / 30)}개월 전`;
}
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

}

};
const PAY_DAY = 25;

/* 한 달치 '원래 기한' 일정을 만든다. 신고·납부 기한이 주말이면 다음 영업일로 미뤄지므로
 * 말일 마감은 다음 달로 넘어갈 수 있다(eventsForMonth에서 보정). 공휴일은 HOLIDAYS에 추가. */
const FIXED_HOLIDAYS = new Set(['01-01', '03-01', '05-05', '06-06', '08-15', '10-03', '10-09', '12-25']); // 양력 고정 공휴일
const HOLIDAYS = new Set([]); // 설·추석·대체공휴일·선거일 등은 연도별로 추가 (예: '2027-02-08')
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const isOff = d => d.getDay() === 0 || d.getDay() === 6 || FIXED_HOLIDAYS.has(ymd(d).slice(5)) || HOLIDAYS.has(ymd(d));

function rawEvents(y, m) {
  const ev = [];
  const next = day => { const d = new Date(y, m, day); while (isOff(d)) d.setDate(d.getDate() + 1); return d; };
  const prev = day => { const d = new Date(y, m, day); while (isOff(d)) d.setDate(d.getDate() - 1); return d; };
  const add = (date, type, title, note) => ev.push({ date, type, title, note });
  const movedNote = (d, day, base) => d.getDate() !== day || d.getMonth() !== m ? `${base} (기한이 주말·공휴일이라 다음 영업일로 이동)` : base;
  const lastDay = new Date(y, m + 1, 0).getDate();

  // 매월 10일: 원천세 신고·납부, 간이지급명세서(거주자 사업소득)
  const d10 = next(10);
  if (m === 2) {
    add(d10, 'ye', '연말정산 원천징수이행상황신고서 제출·납부', movedNote(d10, 10, '2월 지급분, 연말정산 결과 포함'));
    add(d10, 'stmt', '근로·사업·퇴직소득 지급명세서 최종 제출', movedNote(d10, 10, '전년도 귀속분 연간 지급명세서'));
  } else {
    add(d10, 'tax', '원천세 신고·납부', movedNote(d10, 10, '전월 지급분 원천징수이행상황신고서'));
  }
  add(d10, 'stmt', '간이지급명세서 제출 (거주자 사업소득)', movedNote(d10, 10, '전월 지급분'));
  add(d10, 'ins', '4대보험료 납부', '전월분 보험료');

  // 매월 15일: 4대보험 취득·상실 신고
  const d15 = next(15);
  add(d15, 'ins', '4대보험 취득·상실 신고 기한', '전월 입·퇴사자 기준');

  // 급여일: 주말이면 직전 영업일로 당겨 지급
  const dPay = prev(PAY_DAY);
  add(dPay, 'pay', '급여 지급일', dPay.getDate() !== PAY_DAY ? `${PAY_DAY}일이 휴일이라 직전 영업일로 당김` : (m === 1 ? '연말정산 환급·추징 반영' : '정기 급여'));

  // 매월 말일: 간이지급명세서(근로소득·기타소득 등)
  const dEnd = next(lastDay);
  add(dEnd, 'stmt', '간이지급명세서 제출 (근로·기타소득 등)', movedNote(dEnd, lastDay, '전월 지급분'));

  // 연간 일정
  if (m === 0) add(next(15), 'ye', '연말정산 간소화 자료 조회 시작', '홈택스 공개 일정 확인');
  if (m === 2) {
    add(d10, 'ins', '건강보험 보수총액 신고', '전년도 보수총액');
    const d15b = next(15);
    add(d15b, 'ins', '고용·산재보험 보수총액 신고 마감', movedNote(d15b, 15, '근로복지공단, 전년도 보수총액'));
  }
  if (m === 3) add(next(10), 'ins', '건강보험 정산보험료 고지분 납부', '4월분 보험료에 포함');
  if (m === 6) add(new Date(y, 6, 1), 'ins', '국민연금 기준소득월액 상·하한 변경', '7월 적용분');
  if (m === 10) add(next(16), 'ye', '연말정산 사전 안내 공지', '권장 일정');
  if (m === 11) add(next(15), 'law', '내년 최저임금·요율 급여시스템 반영 점검', '권장 일정');
  if (y === 2027 && m === 0) add(new Date(2027, 0, 1), 'law', '최저임금 1만700원, 국민연금 10% 적용', '2027.1.1 시행');
  return ev;
}

/* 달력·마감 목록용: 해당 월에 실제로 떨어지는 일정만 (전월 말일 마감이 넘어온 경우 포함) */
function eventsForMonth(y, m) {
  const inMonth = e => e.date.getFullYear() === y && e.date.getMonth() === m;
  const pm = new Date(y, m - 1, 1);
  return [...rawEvents(pm.getFullYear(), pm.getMonth()), ...rawEvents(y, m)]
    .filter(inMonth)
    .sort((a, b) => a.date - b.date);
}

function HotRoller({ items, bookmarks, onMark }) {
  const [i, setI] = useState(0);
  const [paused, setPaused] = useState(false);
  const reduce = useMemo(() => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches), []);
  useEffect(() => {
    if (paused || reduce || items.length < 2) return;
    const t = setInterval(() => setI(x => (x + 1) % items.length), 7000);
    return () => clearInterval(t);
  }, [paused, reduce, items.length]);
  if (!items.length) return null;
  const a = items[i % items.length];
  const go = d => setI(x => (x + d + items.length) % items.length);
  const marked = bookmarks.includes(a.id);
  return html`
  <section aria-label="급여·보상·노무 필독 이슈" className="relative flex flex-col rounded-lg border border-line bg-surface"
    onMouseEnter=${() => setPaused(true)} onMouseLeave=${() => setPaused(false)}
    onFocus=${() => setPaused(true)} onBlur=${() => setPaused(false)}>
    <div className="absolute left-0 top-0 h-full w-1.5 rounded-l-lg bg-seal"></div>
    <div className="flex items-center justify-between gap-3 border-b border-line px-5 py-3 pl-6">
      <h2 className="flex items-center gap-2 text-[15px] font-semibold">
        <span className="rounded-sm bg-seal px-1.5 py-0.5 text-xs font-bold text-white">필독</span>
        급여·보상·노무 핫이슈
      </h2>
      <div className="flex items-center gap-1">
        <span className="num mr-2 text-sm text-muted">${i + 1} / ${items.length}</span>
        <button onClick=${() => go(-1)} aria-label="이전 이슈" className="rounded-md p-1.5 text-muted hover:bg-sunk hover:text-ink"><${Icon} name="left" /></button>
        <button onClick=${() => go(1)} aria-label="다음 이슈" className="rounded-md p-1.5 text-muted hover:bg-sunk hover:text-ink"><${Icon} name="right" /></button>
      </div>
    </div>
    <div key=${a.id} className="fade-swap flex flex-1 flex-col px-5 py-5 pl-6" aria-live="polite">
      <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-muted">
        <span className="font-medium text-ink">${SOURCES[a.src]}</span>
        <span className=${'rounded px-1.5 py-0.5 text-xs font-medium ' + KIND[a.kind].cls}>${KIND[a.kind].label}</span>
        <time dateTime=${a.date.toISOString()}>${fmtAbs(a.date)} (${fmtRel(a.date)})</time>
      </div>
      <h3 className="mt-3 text-[22px] font-semibold leading-snug tracking-tight sm:text-[24px]">${a.title}</h3>
      <p className="mt-2 max-w-[62ch] text-[15px] leading-relaxed text-muted">${a.summary}</p>
      <div className="mt-auto flex flex-wrap items-center gap-2 pt-5">
        ${a.tags.map(t => html`<span key=${t} className="rounded-full border border-line px-2.5 py-0.5 text-sm text-muted">#${t}</span>`)}
        <span className="flex-1"></span>
        <button onClick=${() => onMark(a.id)} aria-pressed=${marked} aria-label=${marked ? '북마크 해제' : '북마크'}
          className=${'rounded-md border border-line p-2 hover:bg-sunk ' + (marked ? 'text-seal' : 'text-muted')}><${Icon} name="bookmark" filled=${marked} /></button>
        <${OriginLink} a=${a} primary=${true} />
      </div>
      <div className="mt-4 flex gap-1.5" role="tablist" aria-label="이슈 선택">
        ${items.map((it, k) => html`<button key=${it.id} role="tab" aria-selected=${k === i} aria-label=${`${k + 1}번 이슈`} onClick=${() => setI(k)}
          className=${'h-1.5 rounded-full ' + (k === i ? 'w-6 bg-seal' : 'w-3 bg-line hover:bg-muted')}></button>`)}
      </div>
    </div>
  </section>`;
}

      <thead>
        <tr className="border-b border-line text-sm text-muted">
          <th scope="col" className="px-5 py-2 font-medium">항목</th>
          <th scope="col" className="px-2 py-2 text-right font-medium">2026</th>
          <th scope="col" className="px-5 py-2 text-right font-medium">2027</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => html`
        <tr key=${r.k} className="border-b border-line last:border-0">
          <th scope="row" className="px-5 py-3 align-top font-normal">
            <span className="block text-[15px] font-medium">${r.k}</span>
            <span className="block text-sm text-muted">${r.note}</span>
          </th>
          <td className="num px-2 py-3 text-right align-top text-[15px] text-muted">${r.from}${r.unit}</td>
          <td className="px-5 py-3 text-right align-top">
            ${r.to
              ? html`<span className="whitespace-nowrap"><span className="num text-[22px] font-semibold leading-none">${r.to}</span><span className="ml-0.5 text-sm text-muted">${r.unit}</span></span>`
              : html`<a href="https://www.nhis.or.kr" target="_blank" rel="noopener noreferrer" className="text-sm font-medium text-seal underline underline-offset-2">공단에서 확인</a>`}
          </td>
        </tr>`)}
      </tbody>
    </table>
  </section>`;
}

function OriginLink({ a, primary }) {
  const href = linkFor(a);
  if (!href) return null;
  return primary
    ? html`<a href=${href} target="_blank" rel="noopener noreferrer"
        className="inline-flex items-center gap-1.5 rounded-md bg-ink px-3.5 py-2 text-sm font-medium text-paper hover:opacity-90">원문 보기 <${Icon} name="ext" size=${15} /></a>`
    : html`<a href=${href} target="_blank" rel="noopener noreferrer"
        className="inline-flex shrink-0 items-center gap-1 rounded-md border border-line px-2.5 py-1.5 text-sm font-medium hover:border-ink">원문 보기 <${Icon} name="ext" size=${14} /></a>`;
}

function Card({ a, marked, onMark, onTag, activeTag }) {
  return html`
  <article className=${'flex flex-col rounded-lg border bg-surface p-4 ' + (a.urgent ? 'border-seal' : 'border-line')}>
    <div className="flex items-start justify-between gap-3">
      <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">
        <span className="font-semibold">${SOURCES[a.src]}</span>
        <span className=${'rounded px-1.5 py-0.5 text-xs font-medium ' + KIND[a.kind].cls}>${KIND[a.kind].label}</span>
        <span className="rounded border border-line px-1.5 py-0.5 text-xs text-muted" title="상위 분류: 인사·조직(HR), 고용관계(ER), 노사관계(IR)">${a.domain}</span>
        ${a.urgent && html`<span className="rounded bg-sealbg px-1.5 py-0.5 text-xs font-semibold text-seal">필독</span>`}
      </div>
      <button onClick=${() => onMark(a.id)} aria-pressed=${marked} aria-label=${marked ? '북마크 해제' : '북마크'}
        className=${'-m-1 rounded-md p-1.5 hover:bg-sunk ' + (marked ? 'text-seal' : 'text-muted')}><${Icon} name="bookmark" filled=${marked} /></button>
    </div>
    <h3 className="mt-2.5 text-[17px] font-semibold leading-snug">${a.title}</h3>
    <p className="clamp2 mt-1.5 text-[15px] leading-relaxed text-muted">${a.summary}</p>
    <div className="mt-3 flex flex-wrap gap-1.5">
      ${a.tags.map(t => html`<button key=${t} onClick=${() => onTag(t)}
        className=${'rounded-full px-2 py-0.5 text-[13px] ' + (activeTag === t ? 'bg-ink text-paper' : 'bg-sunk text-muted hover:text-ink')}>#${t}</button>`)}
    </div>
    <div className="mt-auto flex items-center justify-between gap-3 border-t border-line pt-3 mt-4">
      <time dateTime=${a.date.toISOString()} className="num text-sm text-muted">${fmtAbs(a.date)} <span className="ml-1">${fmtRel(a.date)}</span></time>
      <${OriginLink} a=${a} />
    </div>
  </article>`;
}

function Chip({ on, onClick, children }) {
  return html`<button onClick=${onClick} aria-pressed=${on}
    className=${'whitespace-nowrap rounded-full border px-3 py-1 text-sm ' + (on ? 'border-ink bg-ink text-paper' : 'border-line bg-surface text-muted hover:text-ink')}>${children}</button>`;
}

function Feed({ q, bookmarks, onMark }) {
  const [tab, setTab] = useState('hrm');
  const [tag, setTag] = useState(null);
  const [src, setSrc] = useState('all');
  const [sort, setSort] = useState('latest');
  const [onlyBM, setOnlyBM] = useState(false);

  const matchQ = a => !q || (a.title + a.summary + a.tags.join(' ') + SOURCES[a.src]).toLowerCase().includes(q.trim().toLowerCase());
  const counts = useMemo(() => Object.fromEntries(TABS.map(t => [t.id, ARTICLES.filter(a => a.tab === t.id && matchQ(a)).length])), [q]);
  const tabItems = ARTICLES.filter(a => a.tab === tab);
  const tags = [...new Set(tabItems.flatMap(a => a.tags))];
  const srcs = [...new Set(tabItems.map(a => a.src))];

  let list = tabItems.filter(a => matchQ(a) && (!tag || a.tags.includes(tag)) && (src === 'all' || a.src === src) && (!onlyBM || bookmarks.includes(a.id)));
  list = list.sort((x, y) => sort === 'latest' ? y.date - x.date
    : (Number(y.urgent) - Number(x.urgent)) || ((y.kind === 'law') - (x.kind === 'law')) || (y.date - x.date));

  const switchTab = id => { setTab(id); setTag(null); setSrc('all'); };
  const reset = () => { setTag(null); setSrc('all'); setOnlyBM(false); };
  const cur = TABS.find(t => t.id === tab);

  return html`
  <section aria-label="카테고리별 뉴스">
    <div className="scroll-x border-b border-line">
      <div role="tablist" className="flex min-w-max gap-1">
        ${TABS.map(t => html`
          <button key=${t.id} role="tab" aria-selected=${tab === t.id} onClick=${() => switchTab(t.id)}
            className=${'-mb-px flex items-center gap-2 border-b-2 px-3.5 py-2.5 text-[15px] ' + (tab === t.id ? 'border-ink font-semibold text-ink' : 'border-transparent text-muted hover:text-ink')}>
            ${t.label}
            <span className=${'num rounded-full px-1.5 text-xs ' + (tab === t.id ? 'bg-ink text-paper' : 'bg-line text-muted')}>${counts[t.id]}</span>
          </button>`)}
      </div>
    </div>

    <div className="mt-3 flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
      <p className="text-[15px] font-medium">${cur.sub}</p>
      <p className="text-sm text-muted">${cur.map}</p>
    </div>

    <div className="mt-3 flex flex-wrap items-center gap-2">
      <div className="scroll-x -mx-1 flex max-w-full gap-1.5 px-1 pb-1">
        <${Chip} on=${!tag} onClick=${() => setTag(null)}>전체 태그<//>
        ${tags.map(t => html`<${Chip} key=${t} on=${tag === t} onClick=${() => setTag(tag === t ? null : t)}>#${t}<//>`)}
      </div>
    </div>
    <div className="mt-2 flex flex-wrap items-center gap-2 text-sm">
      <label className="flex items-center gap-2">
        <span className="text-muted">출처</span>
        <select value=${src} onChange=${e => setSrc(e.target.value)} className="rounded-md border border-line bg-surface px-2 py-1.5 text-ink">
          <option value="all">전체</option>
          ${srcs.map(s => html`<option key=${s} value=${s}>${SOURCES[s]}</option>`)}
        </select>
      </label>
      <div className="flex overflow-hidden rounded-md border border-line" role="group" aria-label="정렬">
        <button onClick=${() => setSort('latest')} aria-pressed=${sort === 'latest'} className=${'px-2.5 py-1.5 ' + (sort === 'latest' ? 'bg-ink text-paper' : 'bg-surface text-muted')}>최신순</button>
        <button onClick=${() => setSort('priority')} aria-pressed=${sort === 'priority'} className=${'border-l border-line px-2.5 py-1.5 ' + (sort === 'priority' ? 'bg-ink text-paper' : 'bg-surface text-muted')}>중요도순</button>
      </div>
      <label className="flex cursor-pointer items-center gap-1.5 rounded-md border border-line bg-surface px-2.5 py-1.5">
        <input type="checkbox" checked=${onlyBM} onChange=${e => setOnlyBM(e.target.checked)} className="accent-current" />
        <span>북마크만 (${bookmarks.length})</span>
      </label>
      <span className="ml-auto text-muted"><span className="num">${list.length}</span>건</span>
    </div>

    ${list.length
      ? html`<div className="mt-4 grid gap-3 md:grid-cols-2">
          ${list.map(a => html`<${Card} key=${a.id} a=${a} marked=${bookmarks.includes(a.id)} onMark=${onMark} activeTag=${tag} onTag=${t => setTag(tag === t ? null : t)} />`)}
        </div>`
      : html`<div className="mt-4 rounded-lg border border-dashed border-line bg-surface px-5 py-10 text-center">
          <p className="font-medium">조건에 맞는 글이 없습니다.</p>
          <p className="mt-1 text-sm text-muted">${onlyBM ? '이 탭에 북마크한 글이 없습니다. 카드 오른쪽 위 북마크 버튼으로 저장하세요.' : '태그나 출처 필터를 풀거나 검색어를 바꿔 보세요.'}</p>
          <button onClick=${reset} className="mt-4 rounded-md border border-line px-3 py-1.5 text-sm font-medium hover:border-ink">필터 초기화</button>
        </div>`}
  </section>`;
}

function CalendarPanel() {
  const [cursor, setCursor] = useState(new Date(NOW.getFullYear(), NOW.getMonth(), 1));
  const [sel, setSel] = useState(startOfDay(NOW));
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const events = useMemo(() => eventsForMonth(y, m), [y, m]);
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const cells = [...Array(first).fill(null), ...Array.from({ length: days }, (_, i) => new Date(y, m, i + 1))];
  const selEvents = events.filter(e => sameDay(e.date, sel));
  const shift = d => setCursor(new Date(y, m + d, 1));

  return html`
  <section aria-label="HR 일정 달력" className="rounded-lg border border-line bg-surface">
    <div className="flex items-center justify-between border-b border-line px-4 py-3">
      <h2 className="text-[15px] font-semibold">HR 일정</h2>
      <div className="flex items-center gap-1">
        <button onClick=${() => shift(-1)} aria-label="이전 달" className="rounded-md p-1 text-muted hover:bg-sunk hover:text-ink"><${Icon} name="left" size=${16} /></button>
        <span className="num w-24 text-center text-sm font-medium">${y}년 ${m + 1}월</span>
        <button onClick=${() => shift(1)} aria-label="다음 달" className="rounded-md p-1 text-muted hover:bg-sunk hover:text-ink"><${Icon} name="right" size=${16} /></button>
      </div>
    </div>
    <div className="px-3 pt-2">
      <div className="grid grid-cols-7 text-center text-xs text-muted">
        ${WD.map((w, i) => html`<div key=${w} className=${'py-1 ' + (i === 0 ? 'text-seal' : '')}>${w}</div>`)}
      </div>
      <div className="grid grid-cols-7 gap-y-0.5">
        ${cells.map((d, i) => {
          if (!d) return html`<div key=${'e' + i}></div>`;
          const evs = events.filter(e => sameDay(e.date, d));
          const isToday = sameDay(d, NOW), isSel = sameDay(d, sel);
          return html`
          <button key=${i} onClick=${() => setSel(d)} aria-label=${`${m + 1}월 ${d.getDate()}일, 일정 ${evs.length}건`} aria-pressed=${isSel}
            className=${'num flex h-11 flex-col items-center justify-start rounded-md pt-1.5 text-sm ' + (isSel ? 'bg-ink text-paper' : isToday ? 'bg-navybg font-semibold text-navy' : 'hover:bg-sunk') + (d.getDay() === 0 && !isSel ? ' text-seal' : '')}>
            ${d.getDate()}
            <span className="mt-1 flex gap-0.5">
              ${[...new Set(evs.map(e => e.type))].slice(0, 3).map(t => html`<span key=${t} className="h-1.5 w-1.5 rounded-full" style=${{ background: isSel ? 'var(--paper)' : EV_TYPE[t].color }}></span>`)}
            </span>
          </button>`;
        })}
      </div>
    </div>
    <div className="mt-2 border-t border-line px-4 py-3">
      <p className="text-sm font-medium">${sel.getMonth() + 1}월 ${sel.getDate()}일 (${WD[sel.getDay()]})</p>
      ${selEvents.length
        ? html`<ul className="mt-2 space-y-2">${selEvents.map((e, k) => html`
            <li key=${k} className="flex gap-2.5 text-sm">
              <span className="mt-1.5 h-2 w-2 shrink-0 rounded-full" style=${{ background: EV_TYPE[e.type].color }}></span>
              <span><span className="font-medium">${e.title}</span><span className="block text-muted">${e.note}</span></span>
            </li>`)}</ul>`
        : html`<p className="mt-1 text-sm text-muted">이 날은 등록된 신고·지급 일정이 없습니다.</p>`}
    </div>
    <div className="flex flex-wrap gap-x-3 gap-y-1 border-t border-line px-4 py-2.5 text-xs text-muted">
      ${Object.entries(EV_TYPE).map(([k, v]) => html`<span key=${k} className="inline-flex items-center gap-1"><span className="h-2 w-2 rounded-full" style=${{ background: v.color }}></span>${v.label}</span>`)}
    </div>
  </section>`;
}

function Upcoming() {
  const today = startOfDay(NOW);
  // 이번 달부터 3개월치 (연도 경계 자동 처리)
  const all = [0, 1, 2].flatMap(k => { const d = new Date(NOW.getFullYear(), NOW.getMonth() + k, 1); return eventsForMonth(d.getFullYear(), d.getMonth()); })
    .filter(e => e.date >= today).slice(0, 8);
  return html`
  <section aria-label="다가오는 마감" className="rounded-lg border border-line bg-surface">
    <h2 className="border-b border-line px-4 py-3 text-[15px] font-semibold">다가오는 마감</h2>
    <ul>
      ${all.map((e, k) => {
        const dd = Math.round((startOfDay(e.date) - today) / 86400000);
        return html`
        <li key=${k} className="flex items-center gap-3 border-b border-line px-4 py-2.5 last:border-0">
          <span className="num w-12 shrink-0 text-center text-sm font-semibold" style=${{ color: dd <= 3 ? 'var(--seal)' : 'var(--muted)' }}>${dd === 0 ? '오늘' : 'D-' + dd}</span>
          <span className="min-w-0 flex-1 text-sm">
            <span className="block truncate font-medium">${e.title}</span>
            <span className="num block text-muted">${e.date.getMonth() + 1}.${e.date.getDate()} (${WD[e.date.getDay()]}) ${EV_TYPE[e.type].label}</span>
          </span>
        </li>`;
      })}
    </ul>
  </section>`;
}

function QuickLinks() {
  const groups = [
    { h: '법령·노무', links: [
      ['고용노동부', 'https://www.moel.go.kr'],
      ['국가법령정보센터', 'https://www.law.go.kr'],
      ['최저임금위원회', 'https://www.minimumwage.go.kr'],
      ['중앙노동위원회', 'https://www.nlrc.go.kr']] },
    { h: '세무·4대보험', links: [
      ['국세청', 'https://www.nts.go.kr'],
      ['홈택스', 'https://www.hometax.go.kr'],
      ['4대사회보험 정보연계센터', 'https://www.4insure.or.kr'],
      ['건강보험 EDI', 'https://edi.nhis.or.kr'],
      ['기획재정부', 'https://www.moef.go.kr']] }
  ];
  return html`
  <section aria-label="바로가기" className="rounded-lg border border-line bg-surface">
    <h2 className="border-b border-line px-4 py-3 text-[15px] font-semibold">바로가기</h2>
    <div className="space-y-3 px-4 py-3">
      ${groups.map(g => html`
        <div key=${g.h}>
          <h3 className="text-sm text-muted">${g.h}</h3>
          <ul className="mt-1">
            ${g.links.map(([t, u]) => html`<li key=${u}>
              <a href=${u} target="_blank" rel="noopener noreferrer" className="flex items-center justify-between rounded-md px-1.5 py-1.5 text-[15px] hover:bg-sunk">
                ${t}<span className="text-muted"><${Icon} name="ext" size=${14} /></span></a></li>`)}
          </ul>
        </div>`)}
    </div>
  </section>`;
}

function App() {
  const [q, setQ] = useState('');
  const [bookmarks, setBookmarks] = useState(loadBM);
  const onMark = id => setBookmarks(prev => { const n = prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]; saveBM(n); return n; });

  const dayMs = 86400000;
  const stats = [
    { label: '최근 24시간 HR 뉴스', note: '전체 탭 기준', value: ARTICLES.filter(a => NOW - a.date < dayMs).length, color: 'var(--ink)' },
    { label: '이번 주 법령·시행령', note: '개정, 입법예고, 고시', value: ARTICLES.filter(a => a.kind === 'law' && NOW - a.date < 7 * dayMs).length, color: 'var(--ledger)' },
    { label: '급여·통상임금·4대보험 이슈', note: '최근 7일', value: ARTICLES.filter(a => NOW - a.date < 7 * dayMs && a.tags.some(t => HOT_TAGS.includes(t))).length, color: 'var(--seal)' }
  ];
  const hot = ARTICLES.filter(a => a.urgent).sort((x, y) => y.date - x.date);

  return html`
  <${React.Fragment}>
    <${Header} q=${q} setQ=${setQ} stats=${stats} />
    <main className="mx-auto max-w-[1360px] px-4 pb-12 pt-5 lg:px-6">
      <p className="mb-4 rounded-md border border-line bg-surface px-3 py-2 text-sm text-muted">
        지금 보이는 목록은 화면 구성을 위한 예시 데이터입니다. 수집 파이프라인을 연결하면 같은 형식의 실제 기사로 바뀝니다.
      </p>
      <div className="grid gap-4 lg:grid-cols-[minmax(0,1.55fr)_minmax(0,1fr)]">
        <${HotRoller} items=${hot} bookmarks=${bookmarks} onMark=${onMark} />
        <${RateBoard} />
      </div>
      <div className="mt-8 grid gap-6 lg:grid-cols-[minmax(0,1fr)_340px]">
        <${Feed} q=${q} bookmarks=${bookmarks} onMark=${onMark} />
        <aside className="space-y-4">
          <${CalendarPanel} />
          <${Upcoming} />
          <${QuickLinks} />
        </aside>
      </div>
      <footer className="mt-10 border-t border-line pt-4 text-sm text-muted">
        급여일은 매월 ${PAY_DAY}일, 신고·제출 기한이 주말·공휴일이면 다음 영업일로 이동합니다. 양력 고정 공휴일은 반영돼 있고, 설·추석·대체공휴일은 HOLIDAYS에, 회사별 일정은 rawEvents()에 추가하세요.
      </footer>
    </main>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
